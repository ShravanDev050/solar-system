name: Solar System Workflow v1

on:
  push:
    branches:
      - main
      - 'feature/*'
  workflow_dispatch:

env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
    MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}    
jobs:
  unit_testing:
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
    env:
     MONGO_URI: 'mongodb://localhost:27017/superData'
     MONGO_USERNAME: non-prod-user
     MONGO_PASSWORD: non-prod-password 
    strategy:
      matrix:
        nodejs_version: [18,19,20]
        operating_system: [ubuntu-latest]
        exclude:
          - nodejs_version: 18
            operating_system: macos-latest
    runs-on: ${{matrix.operating_system}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{matrix.nodejs_version}}
        uses: actions/setup-node@v3
        with:
          node-version: '${{matrix.nodejs_version}}'

      - name: cache dependencies
        uses: actions/cache@v3
        with:
            path: node_modules
            key: ${{runner.os}}-node-modules-${{hashFiles('package-lock.json')}}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: uploadt test artifact
        uses: actions/upload-artifact@v4
        with:
            name: ${{matrix.operating_system}}app-test-result-${{matrix.nodejs_version}}
            path: test-results.xml
  
  
  code_coverage:
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
    env:
     MONGO_URI: 'mongodb://localhost:27017/superData'
     MONGO_USERNAME: non-prod-user
     MONGO_PASSWORD: non-prod-password 
    strategy:
        matrix:
          nodejs_version: [18,19,20]
          operating_system: [ubuntu-latest]
          exclude:
            - nodejs_version: 18
              operating_system: macos-latest
    runs-on: ${{matrix.operating_system}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{matrix.nodejs_version}}
        uses: actions/setup-node@v3
        with:
          node-version: '${{matrix.nodejs_version}}'

      - name: cache dependencies
        uses: actions/cache@v3
        with:
            path: node_modules
            key: ${{runner.os}}-node-modules-${{hashFiles('package-lock.json')}}

      - name: Install dependencies
        run: npm install

      - name: check code coverage
        continue-on-error: true
        run: npm run coverage

      - name: uploadt test artifact
        uses: actions/upload-artifact@v4
        with:
            name: ${{matrix.operating_system}}-code_coverage_result-${{matrix.nodejs_version}}
            path: test-results.xml
  docker:
    name: containerization
    needs: [unit_testing,code_coverage]
    permissions: 
      packages: write
    runs-on: ubuntu-latest
    steps:
    - name: checkout repository
      uses: actions/checkout@v3

    - name: docker login
      uses: docker/login-action@v2.2.0
      with:
        username: ${{vars.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_PASSWORD}}
    
    - name: GHCR login
      uses: docker/login-action@v2.2.0
      with:
        registry: ghcr.io
        username: ${{github.repository_owner}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: Docker Build
      uses: docker/build-push-action@v6
      with:
          context: .
          push: false
          tags: ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}
    - name: Docker image test
      run: |
         docker images
         docker run --name solar-system-app -d \
         -p 3000:3000 \
         -e MONGO_URI=$MONGO_URI \
         -e MONGO_USERNAME=$MONGO_USERNAME \
         -e MONGO_PASSWORD=$MONGO_PASSWORD \
         ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}

         export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
         echo $IP

         echo Testing image url using WGET...

         wget -q -O - 127.0.0.1:3000/live | grep live

    - name: Docker Push
      uses: docker/build-push-action@v6
      with:
          context: .
          push: true
          tags: |
               ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}
               ghcr.io/shravandev050/solar-system:${{github.sha}}
  
  dev-deploy:
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
    - name: checkout repository
      uses: actions/checkout@v3

    - name: Install kubectl cli
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.26.0'
    
    - name: verify kubectl installation
      run: |
           kubectl version --short
           echo "..................................................."
           kubectl get nodes


    